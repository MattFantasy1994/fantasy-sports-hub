<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFL Fantasy Draft League</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            padding: 25px;
        }

        .header-content {
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .header p {
            color: #d1d5db;
        }

        .nav {
            background: #ffffff;
            border-bottom: 1px solid #d1d5db;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav button {
            border: none;
            background: #e5e7eb;
            color: #111827;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav button:hover {
            background: #d1d5db;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .page-title p {
            color: #6b7280;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .stat-card {
            text-align: center;
        }

        .stat-number {
            font-size: 34px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            color: #6b7280;
        }

        .btn {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 3px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-warning {
            background: #d97706;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn:hover {
            opacity: .85;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #111827;
            color: white;
            padding: 11px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .rank-1 {
            background: #fef3c7;
            font-weight: bold;
        }

        .rank-2 {
            background: #e5e7eb;
            font-weight: bold;
        }

        .rank-3 {
            background: #fed7aa;
            font-weight: bold;
        }

        .draft-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .draft-card {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
        }

        .draft-card.current {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .draft-pick {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .matchup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .matchup {
            background: white;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .matchup h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        .player-box {
            padding: 12px;
            border-radius: 6px;
            background: #f3f4f6;
            margin: 5px 0;
        }

        .vs {
            text-align: center;
            font-weight: bold;
            margin: 8px 0;
        }

        .score-input {
            width: 100px;
        }

        .alert {
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .division-box {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .team-list {
            margin-top: 8px;
            color: #4b5563;
        }

        .small {
            font-size: 13px;
            color: #6b7280;
        }

        footer {
            background: #111827;
            color: #d1d5db;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        .hidden {
            display: none;
        }

        @media(max-width: 700px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 24px;
            }

            .nav {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="header-content">
        <div>
            <h1>🏈 NFL Fantasy Draft League</h1>
            <p>30 Players • $75 Entry • Custom NFL Draft Scoring</p>
        </div>

        <div>
            <strong>Prize Pool: $1,200</strong><br>
            <span>1st: $700 • 2nd: $500</span>
        </div>
    </div>
</header>

<nav class="nav">

    <button onclick="showPage('dashboard')">
        🏠 Dashboard
    </button>

    <button onclick="showPage('players')">
        👥 Players
    </button>

    <button onclick="showPage('draft')">
        📝 Draft
    </button>

    <button onclick="showPage('teams')">
        🏈 Picks
    </button>

    <button onclick="showPage('standings')">
        📊 Standings
    </button>

    <button onclick="showPage('schedule')">
        🗓️ Schedule
    </button>

    <button onclick="showPage('weekly')">
        📅 Weekly Scores
    </button>

    <button onclick="showPage('scoring')">
        🧮 Scoring
    </button>

    <button onclick="showPage('playoffs')">
        🏆 Playoffs
    </button>

    <button onclick="showPage('winnings')">
        💰 Winnings
    </button>

    <button onclick="showPage('admin')">
        ⚙️ Admin
    </button>

</nav>

<main class="container" id="app"></main>

<footer>
    <p>NFL Fantasy Draft League</p>
    <p>League data is stored in this browser.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
